<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Тачко-Казик</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 15px;
        }
        .game-container {
            background: #16213e;
            border-radius: 20px;
            padding: 15px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 10px 40px rgba(0,0,0,.5);
        }
        .profile {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f3460;
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 10px;
        }
        .profile-info { text-align: left; }
        .profile-name {
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
        .profile-name:hover { opacity: .8; }
        .profile-level { font-size: 13px; color: #ffd700; }
        .balance {
            font-size: 22px;
            margin: 10px 0;
            color: #ffd700;
            text-shadow: 0 0 10px rgba(255,215,0,.3);
        }
        .tabs { display: flex; gap: 8px; margin: 10px 0; }
        .tab-btn {
            flex: 1;
            padding: 8px;
            background: #0f3460;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            border: 2px solid transparent;
            color: #fff;
            transition: .3s;
        }
        .tab-btn.active { background: #e94560; border-color: #ff6b6b; }
        .slot-machine, .cases, .garage-section {
            background: #0f3460;
            border-radius: 12px;
            padding: 15px;
            margin: 10px 0;
        }
        .reels { display: flex; justify-content: center; gap: 8px; margin: 10px 0; font-size: 45px; }
        .reel {
            background: linear-gradient(145deg, #fff, #e6e6e6);
            border-radius: 12px;
            width: 75px;
            height: 75px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #333;
            font-size: 45px;
            box-shadow: 0 5px 15px rgba(0,0,0,.3);
            transition: .3s;
        }
        button {
            background: #e94560;
            color: #fff;
            border: none;
            padding: 12px 25px;
            border-radius: 20px;
            font-size: 15px;
            cursor: pointer;
            margin: 5px;
            width: calc(100% - 10px);
            max-width: 280px;
            font-weight: bold;
            transition: .2s;
        }
        button:hover { opacity: .9; transform: translateY(-2px); }
        button:active { transform: scale(.95); }
        .case-btn { background: linear-gradient(135deg, #667eea, #764ba2); }
        .sell-btn { background: #00b894; font-size: 11px; padding: 5px 12px; width: auto; }
        .tune-btn { background: #f39c12; font-size: 11px; padding: 5px 12px; width: auto; }
        .reset-btn { background: #636e72; font-size: 10px; padding: 6px 12px; width: auto; }
        .wheel-btn { background: linear-gradient(135deg, #e74c3c, #f39c12); }
        .car-shop { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin: 10px 0; }
        .car-card {
            background: #1a1a4e;
            padding: 10px;
            border-radius: 12px;
            border: 2px solid transparent;
            transition: .3s;
        }
        .car-card:hover { background: #1a4080; border-color: #e94560; }
        .car-card.tuned { border-color: #ffd700 !important; box-shadow: 0 0 10px rgba(255,215,0,.5); }
        .car-emoji {
            font-size: 35px;
            min-height: 65px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .car-emoji img { max-width: 100%; max-height: 60px; object-fit: contain; }
        .car-name { font-weight: bold; font-size: 13px; margin: 3px 0; }
        .car-rarity {
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 8px;
            display: inline-block;
            margin: 3px 0;
            color: #fff;
        }
        .rarity-common { background: #808080; }
        .rarity-uncommon { background: #00b894; }
        .rarity-rare { background: #0984e3; }
        .rarity-legendary { background: #e17055; }
        .rarity-mythical { background: #a29bfe; }
        .rarity-VIP { background: #ffd700; color: #000; }
        .price { color: #ffd700; font-weight: bold; font-size: 12px; }
        .tune-level {
            position: absolute;
            top: 5px;
            right: 5px;
            background: #f39c12;
            color: #000;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 8px;
            font-weight: bold;
        }
        .notification {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: #e94560;
            color: #fff;
            padding: 12px 25px;
            border-radius: 8px;
            z-index: 1000;
            display: none;
            font-weight: bold;
            white-space: nowrap;
        }
        .bet-input {
            padding: 10px;
            border-radius: 8px;
            border: 2px solid #e94560;
            background: #0f3460;
            color: #fff;
            font-size: 16px;
            width: 130px;
            text-align: center;
            outline: none;
        }
        .bet-input:focus { border-color: #ffd700; box-shadow: 0 0 10px rgba(255,215,0,.3); }
        .quick-bet-btn {
            width: auto !important;
            padding: 6px 10px !important;
            font-size: 11px !important;
            margin: 2px !important;
            background: #0f3460;
            border: 1px solid #e94560;
        }
        .quick-bet-btn:hover { background: #e94560; }
        .spin-btn {
            background: linear-gradient(135deg, #f39c12, #e74c3c);
            font-size: 20px;
            padding: 15px;
            margin-top: 10px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,.85);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #16213e;
            border-radius: 15px;
            padding: 15px;
            max-width: 400px;
            width: 90%;
            max-height: 80vh;
            overflow-y: auto;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .modal-close {
            background: #e94560;
            border: none;
            color: #fff;
            width: 28px;
            height: 28px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
        }
        .case-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #0f3460;
            border-radius: 8px;
            padding: 8px;
            margin: 6px 0;
        }
        .chance-bar {
            background: #1a1a4e;
            border-radius: 4px;
            height: 6px;
            margin-top: 4px;
            overflow: hidden;
        }
        .chance-fill { height: 100%; border-radius: 4px; }
        .win-animation { animation: winPulse .5s; }
        @keyframes winPulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.1); }
        }
        .wheel-container {
            position: relative;
            width: 200px;
            height: 200px;
            margin: 15px auto;
        }
        .wheel-arrow {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 30px;
            z-index: 10;
        }
        .top-buttons {
            display: flex;
            gap: 5px;
            justify-content: center;
            margin-bottom: 8px;
            flex-wrap: wrap;
        }
        .small-btn {
            width: auto !important;
            font-size: 11px !important;
            padding: 6px 10px !important;
            margin: 2px !important;
            background: #0f3460;
        }
    </style>
</head>
<body>
<div class="game-container">
    <h1>🚗 Тачко-Казик</h1>
    
    <div class="profile">
        <div class="profile-info">
            <div class="profile-name" id="profileName" onclick="changeNickname()" title="Сменить ник">Игрок ✎</div>
            <div class="profile-level" id="profileLevel">Уровень: 1</div>
            <div style="font-size:11px;color:#aaa" id="totalEarned">Заработано: 0 💰</div>
        </div>
        <button class="reset-btn" onclick="resetProfile()">🔄 Сброс</button>
    </div>
    
    <div class="top-buttons">
        <button class="small-btn" onclick="showStats()">📊</button>
        <button class="small-btn" onclick="changeNickColor()">🎨</button>
        <button class="small-btn" onclick="spinWheel()" style="background:#f39c12">🎡 Колесо</button>
    </div>
    
    <div class="balance" id="balance">Баланс: 1000 💰</div>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="showTab('slots')">🎰 Рулетка</button>
        <button class="tab-btn" onclick="showTab('cases')">📦 Кейсы</button>
        <button class="tab-btn" onclick="showTab('garage')">🏪 Гараж</button>
    </div>
    
    <div id="slots-tab" class="slot-machine">
        <div class="reels">
            <div class="reel" id="reel1">🍒</div>
            <div class="reel" id="reel2">🍋</div>
            <div class="reel" id="reel3">🍊</div>
        </div>
        <div style="margin:10px 0">
            <input type="number" id="betInput" class="bet-input" min="50" max="100000" value="50">
            <span style="color:#ffd700">💰</span>
        </div>
        <div style="display:flex;gap:4px;justify-content:center;flex-wrap:wrap;margin:8px 0">
            <button class="quick-bet-btn" onclick="setBet(50)">50</button>
            <button class="quick-bet-btn" onclick="setBet(100)">100</button>
            <button class="quick-bet-btn" onclick="setBet(500)">500</button>
            <button class="quick-bet-btn" onclick="setBet(1000)">1K</button>
            <button class="quick-bet-btn" onclick="setBet(5000)">5K</button>
            <button class="quick-bet-btn" onclick="setBet(10000)">10K</button>
        </div>
        <button class="spin-btn" onclick="spinWithCustomBet()">🎰 КРУТИТЬ!</button>
        <div id="slots-result"></div>
    </div>
    
    <div id="cases-tab" style="display:none">
        <h3>📦 Кейсы</h3>
        <div style="background:#1a1a4e;border-radius:10px;padding:12px;margin:10px 0">
            <h4>🔑 Базовый (500💰)</h4>
            <button class="case-btn" onclick="openCase('common')">🎁 Открыть</button>
            <button onclick="showCaseContent('common')" style="background:#636e72;width:auto;font-size:12px;padding:8px 15px">👀</button>
        </div>
        <div style="background:#1a1a4e;border-radius:10px;padding:12px;margin:10px 0">
            <h4>🗝️ Премиум (2000💰)</h4>
            <button class="case-btn" onclick="openCase('premium')">🎁 Открыть</button>
            <button onclick="showCaseContent('premium')" style="background:#636e72;width:auto;font-size:12px;padding:8px 15px">👀</button>
        </div>
        <div style="background:#1a1a4e;border-radius:10px;padding:12px;margin:10px 0">
            <h4>💎 Мифический (5000💰)</h4>
            <button class="case-btn" onclick="openCase('mythical')">🎁 Открыть</button>
            <button onclick="showCaseContent('mythical')" style="background:#636e72;width:auto;font-size:12px;padding:8px 15px">👀</button>
        </div>
        <div style="background:#1a1a4e;border-radius:10px;padding:12px;margin:10px 0">
            <h4>🇩🇪 Germany (5000💰)</h4>
            <button class="case-btn" onclick="openCase('germany')">🎁 Открыть</button>
            <button onclick="showCaseContent('germany')" style="background:#636e72;width:auto;font-size:12px;padding:8px 15px">👀</button>
        </div>
        <div id="case-result"></div>
    </div>
    
    <div id="garage-tab" style="display:none">
        <h3>🏪 Гараж (<span id="carCount">0</span>)</h3>
        <div class="car-shop" id="garage"></div>
    </div>
</div>

<div class="notification" id="notification"></div>

function spinWheel() {
    let now = Date.now();
    if (now - GS.lastWheelSpin < 3600000) {
        let min = Math.ceil((3600000 - (now - GS.lastWheelSpin)) / 60000);
        showNotification('Колесо будет доступно через ' + min + ' мин', 'error');
        return;
    }
    
    playSound('spin');
    GS.lastWheelSpin = now;
    
    let m = document.getElementById('caseModal');
    if (!m) { m = document.createElement('div'); m.id = 'caseModal'; m.className = 'modal'; document.body.appendChild(m); }
    
    let canvasId = 'wheelCanvas';
    let html = '<div class="modal-content" style="text-align:center"><h3>🎡 Колесо фортуны</h3>';
    html += '<div class="wheel-container"><div class="wheel-arrow">▼</div><canvas id="' + canvasId + '" width="200" height="200"></canvas></div>';
    html += '<div id="wheelResult" style="font-size:18px;min-height:30px;margin:10px 0"></div>';
    html += '<button onclick="closeModal()">Закрыть</button></div>';
    m.innerHTML = html;
    m.style.display = 'flex';
    
    setTimeout(() => {
        let canvas = document.getElementById(canvasId);
        let ctx = canvas.getContext('2d');
        let segments = wheelPrizes.length;
        let anglePerSegment = (2 * Math.PI) / segments;
        let rotation = 0;
        let spinSpeed = 0.3;
        let targetRotation = Math.random() * 2 * Math.PI + Math.PI * 8;
        let currentSpeed = 0;
        let maxSpeed = 0.5;
        let decelerating = false;
        
        function drawWheel(rot) {
            ctx.clearRect(0, 0, 200, 200);
            for (let i = 0; i < segments; i++) {
                let startAngle = rot + i * anglePerSegment;
                let endAngle = startAngle + anglePerSegment;
                ctx.beginPath();
                ctx.moveTo(100, 100);
                ctx.arc(100, 100, 95, startAngle, endAngle);
                ctx.closePath();
                ctx.fillStyle = wheelPrizes[i].color;
                ctx.fill();
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 2;
                ctx.stroke();
                
                ctx.save();
                ctx.translate(100, 100);
                ctx.rotate(startAngle + anglePerSegment / 2);
                ctx.textAlign = 'right';
                ctx.fillStyle = '#fff';
                ctx.font = 'bold 12px Arial';
                ctx.fillText(wheelPrizes[i].text, 80, 4);
                ctx.restore();
            }
        }
        
        function animate() {
            if (!decelerating) {
                currentSpeed += 0.01;
                if (currentSpeed >= maxSpeed) decelerating = true;
            } else {
                currentSpeed *= 0.98;
                if (currentSpeed < 0.001) {
                    // Определяем победителя
                    let index = Math.floor(((rotation % (2 * Math.PI)) / (2 * Math.PI)) * segments);
                    index = (segments - index) % segments;
                    let prize = wheelPrizes[index];
                    
                    if (prize.reward === 'money') {
                        GS.balance += prize.amount;
                        GS.totalEarned += prize.amount;
                        document.getElementById('wheelResult').innerHTML = '🎉 Выиграл <b>' + prize.amount + '💰</b>!';
                        showNotification('Колесо: +' + prize.amount + '💰', 'win');
                        playSound('win');
                    } else if (prize.reward === 'case') {
                        document.getElementById('wheelResult').innerHTML = '🎁 Выиграл <b>' + (prize.tier === 'common' ? 'Базовый кейс' : 'Премиум кейс') + '</b>!';
                        showNotification('Колесо: кейс!', 'win');
                        playSound('case');
                        setTimeout(() => openCase(prize.tier), 500);
                    } else if (prize.reward === 'car') {
                        GS.garage.push(prize.car);
                        document.getElementById('wheelResult').innerHTML = '🚗 Выиграл <b>' + cars[prize.car].name + '</b>!';
                        showNotification('Колесо: ' + cars[prize.car].name + '!', 'win');
                        playSound('win');
                    }
                    
                    UD(); SG(); checkLevelUp();
                    return;
                }
            }
            rotation += currentSpeed;
            drawWheel(rotation);
            requestAnimationFrame(animate);
        }
        
        drawWheel(0);
        setTimeout(animate, 300);
    }, 200);
    
    m.onclick = function(e) { if (e.target === m) closeModal(); };
}

// ===== ТЮНИНГ =====
function tuneCar(car) {
    let currentLevel = GS.tunedCars[car] || 0;
    if (currentLevel >= 3) {
        showNotification('Максимальный уровень тюнинга! 🔧', 'error');
        return;
    }
    
    let cost = (currentLevel + 1) * cars[car].price * 0.5;
    if (GS.balance < cost) {
        showNotification('Нужно ' + cost + '💰 для тюнинга', 'error');
        return;
    }
    
    GS.balance -= Math.floor(cost);
    GS.tunedCars[car] = currentLevel + 1;
    playSound('win');
    showNotification(cars[car].name + ' прокачан до уровня ' + (currentLevel + 1) + '! 🔧', 'win');
    
    if (GS.tunedCars[car] >= 3 && !GS.achievements.includes('tuner')) {
        GS.achievements.push('tuner');
        showNotification('🏆 Достижение: Тюнер!', 'win');
    }
    
    UD(); SG(); checkLevelUp();
}

function getTunedPrice(car) {
    let level = GS.tunedCars[car] || 0;
    let basePrice = cars[car].price;
    return Math.floor(basePrice * (1 + level * 0.5));
}

// ===== КЕЙСЫ =====
function openCase(t) {
    let costs = { common: 500, premium: 2000, mythical: 5000, germany: 5000 };
    if (!costs[t]) return;
    if (GS.balance < costs[t]) { showNotification('Мало денег!', 'error'); return; }
    
    GS.balance -= costs[t];
    GS.casesOpened++;
    playSound('case');
    
    let drops = caseContents[t];
    let total = drops.reduce((s, d) => s + d.chance, 0);
    let rand = Math.random() * total;
    let sel = drops[0];
    
    for (let d of drops) {
        rand -= d.chance;
        if (rand <= 0) { sel = d; break; }
    }
    
    let items = [];
    for (let i = 0; i < 20; i++) items.push(...drops.sort(() => Math.random() - .5));
    items.push(sel);
    
    let names = { common: '🔑 Базовый', premium: '🗝️ Премиум', mythical: '💎 Мифический', germany: '🇩🇪 Germany' };
    let m = document.getElementById('caseModal');
    if (!m) { m = document.createElement('div'); m.id = 'caseModal'; m.className = 'modal'; document.body.appendChild(m); }
    
    m.innerHTML = '<div class="modal-content" style="text-align:center"><h3>' + names[t] + '</h3><div style="overflow:hidden;height:100px;background:#000;border-radius:10px;margin:15px 0;position:relative"><div id="scrollStrip">' + items.map(i => '<div style="display:flex;align-items:center;justify-content:center;height:100px;border-bottom:1px solid #222"><span style="font-size:40px">' + i.car + '</span><span style="margin-left:10px;color:' + i.color + '">' + cars[i.car].name + '</span></div>').join('') + '</div><div style="position:absolute;top:50%;left:0;right:0;height:2px;background:#e94560;transform:translateY(-50%)"></div></div><div id="modalResult"></div><button onclick="closeModal()">Забрать</button></div>';
    m.style.display = 'flex';
    
    setTimeout(() => {
        document.getElementById('scrollStrip').style.transition = 'transform 3s ease-out';
        document.getElementById('scrollStrip').style.transform = 'translateY(-' + (items.length - 1) * 100 + 'px)';
    }, 100);
    
    setTimeout(() => {
        let ci = cars[sel.car];
        GS.garage.push(sel.car);
        document.getElementById('modalResult').innerHTML = '<div>🎉 ' + sel.car + '<br><b>' + ci.name + '</b><br><span class="car-rarity rarity-' + ci.rarity + '">' + ci.rarity.toUpperCase() + '</span><br>💰 ' + ci.price + '</div>';
        
        if (ci.rarity === 'legendary' || ci.rarity === 'mythical' || ci.rarity === 'VIP') {

            if (!GS.achievements.includes('legendary')) {

                showNotification('🏆 Достижение: Легенда!', 'win');
            }
        }
        
        UD(); SG(); checkLevelUp();
    }, 3200);
}

            + '<div class="car-rarity rarity-' + ci.rarity + '">' + ci.rarity + '</div>'
            + '<div class="price">💰 ' + currentPrice + '</div>'
            + '<button class="sell-btn" onclick="sellCar(\'' + c + '\')">💸</button>'
            + '<button class="tune-btn" onclick="tuneCar(\'' + c + '\')">🔧 ' + ((GS.tunedCars[c] || 0) >= 3 ? 'МАКС' : Math.floor(((GS.tunedCars[c] || 0) + 1) * cars[c].price * 0.5) + '💰') + '</button>'
            + '</div>';
    }).join('');
}

// ===== СБРОС =====
function resetProfile() {
    if (confirm('Сбросить ВЕСЬ прогресс? Это нельзя отменить!')) {
        GS = {
            balance: 1000,
            garage: ['🚲'],
            tunedCars: {},
            profileName: 'Игрок',
            level: 1,
            totalEarned: 0,
            spinsCount: 0,
            casesOpened: 0,
            soldCount: 0,
            achievements: [],
            nickColor: '#e94560',
            lastWheelSpin: 0
        };
        SG(); UD();
        showNotification('Прогресс сброшен 🔄');
    }
}

// ===== ВКЛАДКИ =====
function showTab(t) {
    document.getElementById('slots-tab').style.display = t === 'slots' ? 'block' : 'none';
    document.getElementById('cases-tab').style.display = t === 'cases' ? 'block' : 'none';
    document.getElementById('garage-tab').style.display = t === 'garage' ? 'block' : 'none';
    
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    
    if (t === 'garage') updateGarage();
}
